[package]
name = "tiles"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
cosmwasm-schema = "2.2"
# `default-features = false` drops `std`, which is what a wasm contract wants, but the
# `iterator` feature and the host-API version must be requested explicitly: without
# `iterator` the linker cannot resolve `db_scan`/`db_next` for `cw721-base`'s indexed
# storage, and without `cosmwasm_2_2` the contract does not declare which host API it
# targets. Both are required for a wasm build that actually uploads.
cosmwasm-std = { version = "2.2", default-features = false, features = [
    "iterator",
    "cosmwasm_2_2",
] }
cw-storage-plus = { version = "2.0", default-features = false, features = ["iterator"] }
cw2 = "2.0"
cw721 = "0.22.0"
cw721-base = "0.22.0"
thiserror = { version = "2.0", default-features = false }
sha2 = { version = "0.10", default-features = false }
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
anyhow = "1.0"
cw-multi-test = { version = "2.5.1", features = ["cosmwasm_2_2"] }
bech32 = "0.11"
sha2 = "0.10"

[profile.release]
rpath = false
lto = true
overflow-checks = true
opt-level = 3
debug = false
debug-assertions = false
codegen-units = 1
panic = "abort"
# `strip = true` removes the symbol table, and wasm contracts must keep it: the VM reads
# custom sections (contract name, version, and the exports it calls by name) and a stripped
# module fails to deserialise at upload with
# `Wasm bytecode could not be deserialized: zero byte expected`.
strip = false

