[workspace]
resolver = "2"

[package]
name = "tiles"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[dependencies]
cosmwasm-schema = "2.2"
cosmwasm-std = { version = "2.2", default-features = false }
cw-storage-plus = { version = "2.0", default-features = false }
cw2 = "2.0"
cw721 = "0.22.0"
cw721-base = "0.22.0"
thiserror = { version = "2.0", default-features = false }
sha2 = { version = "0.10", default-features = false }
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
anyhow = "1.0"
cw-multi-test = { version = "2.5.1", features = ["cosmwasm_2_2"] }
bech32 = "0.11"
sha2 = "0.10"

[profile.release]
rpath = false
lto = true
overflow-checks = true
opt-level = 3
debug = false
debug-assertions = false
codegen-units = 1
panic = "abort"
strip = true

